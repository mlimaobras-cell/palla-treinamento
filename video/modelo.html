<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-600-normal.woff2); }
@font-face { font-family: "Chakra Petch"; font-weight: 700; src: url(../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2); }
:root { --azul: #404D91; --vermelho: #D13542; --escuro: #1E2550; --claro: #F5F6FA; --tinta: #E8EAF6; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--escuro); }
body { font-family: "IBM Plex Sans", sans-serif; color: #fff; }
#palco { position: relative; width: 1280px; height: 720px; overflow: hidden;
  background: radial-gradient(120% 90% at 85% 10%, #2E3A7A 0%, var(--escuro) 55%, #141A3C 100%); }
/* feixes de luz em movimento contínuo */
.feixe { position: absolute; top: -40%; width: 220px; height: 180%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
  transform: rotate(28deg); animation: varre 9s linear infinite; }
.feixe.b { width: 120px; animation-duration: 13s; animation-delay: -4s; opacity: .7; }
.feixe.c { width: 320px; animation-duration: 17s; animation-delay: -10s; opacity: .5; }
@keyframes varre { from { left: -40%; } to { left: 120%; } }
.grade { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 64px 64px; mask-image: radial-gradient(circle at 70% 40%, #000 0%, transparent 75%); }
.logo-canto { position: absolute; right: 48px; top: 36px; height: 40px; opacity: .9; }
.barra-rodape { position: absolute; left: 0; bottom: 0; height: 8px; width: 260px; background: var(--vermelho); }
.rotulo-curso { position: absolute; left: 64px; top: 44px; font: 500 18px "IBM Plex Sans"; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); }

.cena { position: absolute; inset: 0; opacity: 0;
  animation: cena-in .5s ease-out var(--ini) both, cena-out .45s ease-in calc(var(--ini) + var(--dur) - .45s) forwards; }
@keyframes cena-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes cena-out { from { opacity: 1; } to { opacity: 0; } }
.e { animation: sobe .7s cubic-bezier(.2,.8,.2,1) calc(var(--ini) + var(--d, 0s)) both; }
.e.esq { animation-name: entra-esq; }
.e.zoom { animation-name: zoom; animation-duration: .8s; }
@keyframes sobe { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes entra-esq { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
@keyframes zoom { 0% { opacity: 0; transform: scale(.6); } 70% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
.risco { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: desenha 1.6s ease-out calc(var(--ini) + var(--d, .3s)) forwards; }
@keyframes desenha { to { stroke-dashoffset: 0; } }
.varre-barra { transform-origin: left; animation: barra .8s cubic-bezier(.2,.8,.2,1) calc(var(--ini) + var(--d, 0s)) both; }
@keyframes barra { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.pulsa { animation: pulsa 1.4s ease-in-out calc(var(--ini) + var(--d, 0s)) infinite; }
@keyframes pulsa { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

h1, h2, .num { font-family: "Chakra Petch", sans-serif; }
/* abertura */
.ab { display: flex; flex-direction: column; justify-content: center; padding: 0 96px; height: 100%; }
.ab .logo { height: 72px; margin-bottom: 48px; align-self: flex-start; }
.ab .eyebrow { font: 600 22px "IBM Plex Sans"; letter-spacing: .16em; text-transform: uppercase; color: #F2A0A8; }
.ab h1 { font-size: 76px; line-height: 1.02; font-weight: 700; margin-top: 14px; max-width: 900px; }
.ab .linha { height: 8px; width: 180px; background: var(--vermelho); margin-top: 32px; }
/* destaque */
.dt { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; height: 100%; }
.dt .pequeno { font: 600 22px "IBM Plex Sans"; letter-spacing: .18em; text-transform: uppercase; color: #F2A0A8; }
.dt h1 { font-size: 132px; line-height: 1; margin-top: 18px; }
.dt p { font-size: 30px; color: var(--tinta); margin-top: 26px; }
/* regra */
.rg { display: grid; grid-template-columns: 320px 1fr; align-items: center; gap: 64px; padding: 0 110px; height: 100%; }
.anel { position: relative; width: 300px; height: 300px; }
.anel svg { position: absolute; inset: 0; }
.anel .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 150px; font-weight: 700; color: #fff; }
.rg .tag { display: inline-block; font: 600 18px "IBM Plex Sans"; letter-spacing: .08em; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); }
.rg h2 { font-size: 58px; line-height: 1.05; margin-top: 18px; }
.rg p { font-size: 28px; line-height: 1.4; color: var(--tinta); margin-top: 20px; max-width: 640px; }
.icone { position: absolute; right: 96px; bottom: 80px; width: 150px; height: 150px; }
/* recusa */
.rc { display: grid; grid-template-columns: 360px 1fr; align-items: center; gap: 72px; padding: 0 110px; height: 100%; }
.rc h2 { font-size: 72px; }
.rc p { font-size: 32px; line-height: 1.4; margin-top: 18px; color: var(--tinta); }
.rc .rodape { margin-top: 30px; font-size: 22px; color: #F2A0A8; }
/* resumo */
.rs { padding: 120px 110px 0; }
.rs h2 { font-size: 52px; }
.rs ol { list-style: none; margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 48px; }
.rs li { display: flex; align-items: center; gap: 18px; font-size: 25px; }
.rs li b { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--vermelho); font: 700 24px "Chakra Petch"; }
/* encerramento */
.en { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 36px; }
.en .logo { height: 110px; }
.en p { font: 600 34px "Chakra Petch"; }

/* tipos genéricos */
.cx { padding: 92px 96px 0; }
.eyebrow-s { font: 600 17px "IBM Plex Sans"; letter-spacing: .16em; text-transform: uppercase; color: #F2A0A8; }
.cx h2 { font-size: 48px; line-height: 1.08; margin-top: 10px; max-width: 1000px; }
.grade-c { display: grid; gap: 20px; margin-top: 34px; }
.g1, .g2, .g4 { grid-template-columns: 1fr 1fr; } .g3, .g5, .g6 { grid-template-columns: 1fr 1fr 1fr; }
.card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-top: 5px solid var(--vermelho); border-radius: 10px; padding: 20px 24px; }
.card h3 { font: 700 27px "Chakra Petch"; }
.card p { font-size: 19.5px; line-height: 1.4; color: var(--tinta); margin-top: 8px; }
.tb { margin-top: 30px; display: grid; gap: 10px; }
.tb.duas { grid-template-columns: 1fr 1fr; column-gap: 28px; }
.lin { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: center; background: rgba(255,255,255,.06); border-left: 5px solid var(--vermelho); border-radius: 6px; padding: 13px 20px; }
.tb.duas .lin { grid-template-columns: 190px 1fr; }
.lin b { font: 700 23px "Chakra Petch"; }
.lin span { font-size: 19.5px; line-height: 1.35; color: var(--tinta); }
.fx { display: flex; align-items: stretch; gap: 0; margin-top: 46px; }
.passo { flex: 1; display: flex; flex-direction: column; gap: 10px; background: rgba(255,255,255,.07); border-radius: 10px; padding: 20px 18px; border-top: 5px solid var(--azul); }
.passo.forte { background: rgba(209,53,66,.22); border-top-color: var(--vermelho); }
.passo i { font: 700 normal 34px "Chakra Petch"; color: #F2A0A8; }
.passo h3 { font: 700 23px "Chakra Petch"; }
.passo p { font-size: 17.5px; line-height: 1.35; color: var(--tinta); }
.seta { width: 34px; align-self: center; height: 4px; background: var(--vermelho); position: relative; margin: 0 6px; }
.seta:after { content: ""; position: absolute; right: -2px; top: -7px; border: 9px solid transparent; border-left: 12px solid var(--vermelho); border-right: 0; }
.al { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; padding: 0 96px; height: 100%; align-items: center; }
.al h2 { font-size: 50px; line-height: 1.08; margin-top: 10px; }
.al .txt { font-size: 24px; line-height: 1.45; color: var(--tinta); margin-top: 20px; }
.caixa { background: rgba(209,53,66,.16); border-left: 8px solid var(--vermelho); border-radius: 6px; padding: 30px 34px; }
.caixa h3 { font: 700 28px "Chakra Petch"; color: #F7B4BB; }
.caixa ul { list-style: none; margin-top: 14px; display: grid; gap: 12px; }
.caixa li { font-size: 22px; line-height: 1.35; padding-left: 30px; position: relative; }
.caixa li:before { content: ""; position: absolute; left: 0; top: 10px; width: 14px; height: 14px; background: var(--vermelho); border-radius: 3px; }
.fr { display: flex; flex-direction: column; justify-content: center; padding: 0 110px; height: 100%; gap: 30px; }
.fr h1 { font-size: 64px; line-height: 1.08; max-width: 1060px; }
.fr h1 em { font-style: normal; color: #F2A0A8; }
.fr p { font-size: 26px; color: var(--tinta); max-width: 900px; line-height: 1.4; }
.fr .barra { width: 10px; position: absolute; left: 0; top: 0; bottom: 0; background: var(--vermelho); }
</style>
</head>
<body>
<div id="palco">
  <div class="grade"></div>
  <div class="feixe"></div><div class="feixe b"></div><div class="feixe c"></div>
  <div id="cenas"></div>
  <div class="barra-rodape"></div>
</div>
<script>
const LOGO = "../public/logo-palla-branco.png";
const ICONES = {
  altura: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path class="risco" d="M14 30h132M14 46h132M40 30v16M120 30v16"/><circle class="risco" cx="80" cy="58" r="9"/>
    <path class="risco" d="M80 67v34"/><path class="risco" d="M62 104c0 18 36 18 36 0l-18 -8z"/><path class="risco" d="M66 126l-8 22M94 126l8 22"/></svg>`,
  carga: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path class="risco" d="M80 6v26"/><path class="risco" d="M80 32c-12 0-12 16 0 16s12-12 2-14"/><path class="risco" d="M54 56l26-10 26 10"/>
    <rect class="risco" x="40" y="56" width="80" height="30" rx="3"/><circle class="risco" cx="80" cy="116" r="8"/><path class="risco" d="M80 124v20M68 132h24"/>
    <path class="risco" d="M52 100l56 56M108 100l-56 56" stroke="#D13542" stroke-width="8"/></svg>`,
  maquina: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle class="risco" cx="80" cy="80" r="22"/><path class="risco" d="M80 22v18M80 120v18M22 80h18M120 80h18M39 39l13 13M108 108l13 13M39 121l13-13M108 52l13-13"/>
    <circle class="risco" cx="80" cy="80" r="44"/></svg>`,
  protecao: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path class="risco" d="M80 10l56 20v40c0 38-26 64-56 80-30-16-56-42-56-80V30z"/><path class="risco" d="M54 80l18 18 34-36"/></svg>`,
  documento: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect class="risco" x="32" y="22" width="96" height="124" rx="8"/><path class="risco" d="M60 16h40v16H60z"/><path class="risco" d="M50 64h60M50 86h60M50 108h34"/><path class="risco" d="M96 112l10 10 20-24" stroke="#D13542"/></svg>`,
  capacete: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path class="risco" d="M28 104c0-34 22-58 52-58s52 24 52 58"/><path class="risco" d="M14 104h132v16H14z"/><path class="risco" d="M68 46v-10h24v10M80 46v58"/><path class="risco" d="M40 120c10 22 70 22 80 0"/></svg>`,
  isolamento: `<svg viewBox="0 0 160 160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path class="risco" d="M30 140l14-80h12l14 80z"/><path class="risco" d="M90 140l14-80h12l14 80z"/><path class="risco" d="M20 140h120"/>
    <path class="risco" d="M50 76h60M48 92h64" stroke="#D13542" stroke-width="7"/></svg>`,
};

function anel(n, d) {
  return `<div class="anel e zoom" style="--d:${d}s">
    <svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="132" stroke="rgba(255,255,255,.12)" stroke-width="18" fill="none"/>
    <circle class="risco" style="--d:${d + .2}s" cx="150" cy="150" r="132" stroke="#D13542" stroke-width="18" fill="none" stroke-linecap="round" transform="rotate(-90 150 150)"/></svg>
    <div class="num">${n}</div></div>`;
}

function html(c, meta) {
  switch (c.tipo) {
    case "cartoes": { const n = c.itens.length; return `<div class="cx"><div class="eyebrow-s e" style="--d:.1s">${c.pequeno ?? ""}</div><h2 class="e esq" style="--d:.3s">${c.titulo}</h2>
      <div class="grade-c g${n}">${c.itens.map((it, i) => `<div class="card e" style="--d:${c.passos[i]}s"><h3>${it.titulo}</h3>${it.texto ? `<p>${it.texto}</p>` : ""}</div>`).join("")}</div></div>`; }
    case "tabela": return `<div class="cx"><div class="eyebrow-s e" style="--d:.1s">${c.pequeno ?? ""}</div><h2 class="e esq" style="--d:.3s">${c.titulo}</h2>
      <div class="tb ${c.itens.length > 6 ? "duas" : ""}">${c.itens.map((it, i) => `<div class="lin e esq" style="--d:${c.passos[i]}s"><b>${it.titulo}</b><span>${it.texto}</span></div>`).join("")}</div></div>`;
    case "fluxo": return `<div class="cx"><div class="eyebrow-s e" style="--d:.1s">${c.pequeno ?? ""}</div><h2 class="e esq" style="--d:.3s">${c.titulo}</h2>
      <div class="fx">${c.itens.map((it, i) => `${i ? `<div class="seta e" style="--d:${c.passos[i] - .1}s"></div>` : ""}<div class="passo e ${it.forte ? "forte" : ""}" style="--d:${c.passos[i]}s"><i>${i + 1}</i><h3>${it.titulo}</h3>${it.texto ? `<p>${it.texto}</p>` : ""}</div>`).join("")}</div>
      ${c.rodape ? `<p class="e" style="--d:${c.passos.at(-1) + 1}s;margin-top:34px;font-size:23px;color:var(--tinta);max-width:1000px">${c.rodape}</p>` : ""}</div>`;
    case "alerta": return `<div class="al"><div><div class="eyebrow-s e" style="--d:.1s">${c.pequeno ?? ""}</div><h2 class="e esq" style="--d:.3s">${c.titulo}</h2>${c.texto ? `<p class="txt e" style="--d:.9s">${c.texto}</p>` : ""}</div>
      <div class="caixa e zoom" style="--d:${Math.max(.6, c.passos[0] - .5)}s"><h3>${c.caixa ?? "Na prática"}</h3><ul>${c.itens.map((it, i) => `<li class="e" style="--d:${c.passos[i]}s">${it.titulo ?? it}</li>`).join("")}</ul></div></div>`;
    case "frase": return `<div class="barra"></div><div class="fr"><h1 class="e" style="--d:.3s">${c.titulo}</h1>${c.texto ? `<p class="e" style="--d:1.4s">${c.texto}</p>` : ""}</div>`;
    case "abertura": return `<div class="ab">
      <img class="logo e" style="--d:.1s" src="${LOGO}">
      <div class="eyebrow e" style="--d:.5s">${meta.capitulo}</div>
      <h1 class="e" style="--d:.8s">${meta.titulo}</h1>
      <div class="linha varre-barra" style="--d:1.3s"></div></div>`;
    case "destaque": return `<div class="dt">
      <div class="pequeno e" style="--d:.2s">${c.pequeno}</div>
      <div class="pulsa" style="--d:1.6s"><h1 class="e zoom" style="--d:.6s">${c.grande}</h1></div>
      <p class="e" style="--d:1.4s">${c.texto}</p></div>`;
    case "regra": return `<div class="rotulo-curso e" style="--d:0s">Regra de ouro ${c.numero} de 7</div><div class="rg">
      ${anel(c.numero, .2)}
      <div><span class="tag e" style="--d:.7s">${c.tag}</span><h2 class="e esq" style="--d:.9s">${c.titulo}</h2><p class="e" style="--d:1.5s">${c.texto}</p></div></div>
      <div class="icone e" style="--d:1.8s">${ICONES[c.icone].replaceAll('class="risco"', 'class="risco" style="--d:2s"')}</div>`;
    case "recusa": return `<div class="rc">
      <div class="pulsa" style="--d:1.2s"><svg class="e zoom" style="--d:.2s" viewBox="0 0 300 300" width="320" height="320"><polygon points="88,10 212,10 290,88 290,212 212,290 88,290 10,212 10,88" fill="#D13542" stroke="#fff" stroke-width="10"/>
      <text x="150" y="178" text-anchor="middle" font-family="Chakra Petch" font-weight="700" font-size="88" fill="#fff">PARE</text></svg></div>
      <div><h2 class="e esq" style="--d:.7s">${c.titulo}</h2><p class="e" style="--d:1.3s">${c.texto}</p><div class="rodape e" style="--d:2.4s">${c.rodape}</div></div></div>`;
    case "resumo": return `<div class="rs"><h2 class="e esq" style="--d:.2s">${c.titulo}</h2><ol>
      ${c.itens.map((t, i) => `<li class="e" style="--d:${(c.passos?.[i] ?? .8 + i * .9)}s"><b>${i + 1}</b>${t.titulo ?? t}</li>`).join("")}</ol></div>`;
    case "encerramento": return `<div class="en"><img class="logo e zoom" style="--d:.2s" src="${LOGO}"><p class="e" style="--d:.9s">${c.texto}</p><div class="varre-barra" style="--d:1.3s;height:6px;width:160px;background:#D13542"></div></div>`;
  }
}

window.montar = (meta, tempos) => {
  const alvo = document.getElementById("cenas");
  meta.cenas.forEach((c, i) => {
    const s = document.createElement("section");
    s.className = "cena";
    s.style.setProperty("--ini", tempos[i].inicio + "s");
    s.style.setProperty("--dur", tempos[i].duracao + "s");
    const canto = !["abertura", "encerramento", "frase"].includes(c.tipo) ? `<img class="logo-canto" src="${LOGO}">` : "";
    s.innerHTML = canto + html(c, meta);
    // atrasos internos relativos ao início da cena
    s.querySelectorAll("[style*='--d']").forEach((el) => el.style.setProperty("--ini", tempos[i].inicio + "s"));
    alvo.appendChild(s);
  });
  return Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => document.fonts.ready);
};

window.irPara = (seg) => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = seg * 1000; }
};
</script>
</body>
</html>
